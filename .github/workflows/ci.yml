name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  haas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Client tests
        run: python -m unittest discover -s tests -v
      - name: Compile integration
        run: python -m compileall -q custom_components

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        working-directory: macos/TesmartMatrix
        run: ./build_app.sh
